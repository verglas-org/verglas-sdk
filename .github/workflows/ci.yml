name: Verglas SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter verglas...
      - run: pnpm test
        working-directory: packages/worker-js
      - run: python3 -m unittest discover -s packages/worker-py/tests -v
      - run: pnpm vitest run src/__tests__/api-base-url.test.ts
        working-directory: packages/verglas
      - run: pnpm vitest run tests/cfetch-utils.test.ts
        working-directory: packages/workers-utils
