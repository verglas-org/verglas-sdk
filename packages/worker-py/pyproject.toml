[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "verglas-worker"
version = "0.1.1"
description = "Build Cloudflare-style Python Workers into Verglas WebAssembly components."
readme = "README.md"
requires-python = ">=3.11"
license = "FSL-1.1-ALv2"
dependencies = ["componentize-py==0.25.0"]

[project.urls]
Homepage = "https://github.com/verglas-org/verglas-sdk/tree/main/packages/worker-py"
Repository = "https://github.com/verglas-org/verglas-sdk"

[project.scripts]
verglas-worker-py-build = "build:main"

[tool.setuptools]
py-modules = ["build"]
packages = ["workers"]

[tool.setuptools.package-data]
workers = ["wit/*.wit"]
