name: Verglas SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cli:
    runs-on: [self-hosted, fly]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run src/__tests__/api-base-url.test.ts
        working-directory: packages/verglas
      - run: pnpm vitest run tests/cfetch-utils.test.ts
        working-directory: packages/workers-utils
      - run: pnpm run build
        working-directory: packages/verglas
